<style>
.r4x2{display:block;width:100%;margin:6px 0 0;background:#fff;border:2px solid var(--r4-deep,#231c25);border-radius:4px;padding:14px 12px;cursor:pointer;font-family:'Montserrat',Arial,sans-serif;color:var(--r4-deep,#231c25);text-align:center;transition:background .15s,transform .2s cubic-bezier(.16,1,.3,1)}
.r4x2:hover{background:var(--r4-soft,#f5f2f6);transform:translateY(-1px)}
.r4x2:focus-visible{outline:3px solid var(--r4-action,#c4472f);outline-offset:3px}
.r4x2 b{display:block;font-size:15px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.r4x2 span{display:block;font-size:13px;color:var(--r4-muted,#5f5966);margin-top:3px;line-height:1.5}
.r4x2[hidden]{display:none}
.r4x2-note{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px 14px;margin:16px 0 0;font-family:'Montserrat',Arial,sans-serif;font-size:12px;line-height:1.6;color:var(--r4-muted,#5f5966);text-align:center}
.r4x2-note span{display:inline-flex;align-items:center;gap:6px}
.r4x2-note svg{width:13px;height:13px;flex:none}
</style>
<button type="button" class="r4x2" id="r4co-2x"><b>Ou payer en 2 × 55 €</b><span data-r4x2-sub>55 € aujourd’hui, puis 55 € dans un mois · total 110 €</span></button>
<p class="r4x2-note"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Paiement sécurisé par Stripe</span><span>✓ Accès envoyé par email juste après</span><span>✓ Accès à vie</span></p>
<script>
(function(){
  var BUMP = 9; /* prix de l'order bump La Vision Claire */
  var allow = false, essais = 0;
  function radios() { return [].slice.call(document.querySelectorAll('[id^="offerprice-"] input[type=radio]')); }
  /* retrouve la formule voulue par son libellé (« chaque mois », « 2 fois »), sinon par sa position */
  function radioPlan(enDeuxFois) {
    var rs = radios();
    for (var i = 0; i < rs.length; i++) {
      var bloc = rs[i].closest('article') || rs[i].parentElement;
      var multi = /mois|fois|month/i.test(bloc ? bloc.textContent : '');
      if (multi === enDeuxFois) return rs[i];
    }
    return rs[enDeuxFois ? 1 : 0];
  }
  function choisir(enDeuxFois, suite) { var r = radioPlan(enDeuxFois); if (r && !r.checked) r.click(); setTimeout(suite, 250); }
  function payer(pb) { allow = true; pb.click(); allow = false; }
  (function init() {
    var pe = document.querySelector('[id^="payment-button-"]');
    var pb = pe && (pe.tagName === 'BUTTON' ? pe : pe.querySelector('button'));
    var b2 = document.getElementById('r4co-2x');
    if (!pb || !b2 || radios().length < 2) {
      if (++essais < 80) return setTimeout(init, 250);
      if (b2 && radios().length < 2) b2.hidden = true; /* une seule formule configurée : on masque le bouton 2 × */
      return;
    }
    /* bouton principal = paiement unique ; bouton secondaire = 2 × 55 € */
    pb.addEventListener('click', function (e) { if (allow) return; e.preventDefault(); e.stopImmediatePropagation(); choisir(false, function () { payer(pb); }); }, true);
    b2.addEventListener('click', function (e) { e.preventDefault(); choisir(true, function () { payer(pb); }); });
  })();

  /* rappel du bump dans le sous-titre du bouton 2 × */
  function majSous() {
    var c = document.querySelector('[id^="orderbump-"] input[type=checkbox]'), s = document.querySelector('[data-r4x2-sub]');
    if (!s) return;
    s.textContent = (c && c.checked)
      ? '55 € aujourd’hui (+ ' + BUMP + ' € pour La Vision Claire), puis 55 € dans un mois'
      : '55 € aujourd’hui, puis 55 € dans un mois · total 110 €';
  }
  document.addEventListener('change', function (e) { if (e.target.closest && e.target.closest('[id^="orderbump-"]')) setTimeout(majSous, 0); });
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[id^="orderbump-"]')) setTimeout(majSous, 50); });
})();
</script>
