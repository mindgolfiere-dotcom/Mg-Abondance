<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MG Abondance</title>
    <meta name="description" content="Un espace où l'abondance financière devient naturelle." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Instrument Serif', 'serif'],
            },
            colors: {
              navy: {
                900: '#020617',
                950: '#01030d', // Custom very deep navy
              },
              gold: {
                400: '#FFD700',
                500: '#FFA500',
              }
            },
            animation: {
              'float': 'float 8s ease-in-out infinite',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #01030d;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      .cosmic-bg {
        /* Revised gradient: Blue at top (0%), Black at bottom (80-100%) */
        background: radial-gradient(circle at 50% 0%, #1a1f35 0%, #01030d 80%);
        background-attachment: fixed;
      }
    </style>
